{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>{% block title %}{{ personal.name }} | {{ personal.title }}{% endblock %}</title>
    <meta
      name="description"
      content="Malla Bala Raju — B.Tech CSE student (LPU 2023–2027) building web apps with Django, FastAPI, Next.js and deploying with Docker, Kubernetes, Terraform, and CI/CD."
    />
    <meta name="theme-color" content="#10B981" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090D11'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='24' fill='%2310B981'%3EMBR%3C/text%3E%3C/svg%3E"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ personal.name }} | {{ personal.title }}" />
    <meta
      property="og:description"
      content="B.Tech CSE student (LPU 2023–2027) building web systems with Django, FastAPI, Next.js, Docker, Kubernetes, and Terraform."
    />
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'portfolio/img/og-image.png' %}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Malla Bala Raju — Full-Stack and DevOps Engineer portfolio preview" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ personal.name }} | {{ personal.title }}" />
    <meta
      name="twitter:description"
      content="Full-Stack & DevOps Engineer — Django, FastAPI, Next.js, Docker, Kubernetes, Terraform."
    />
    <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'portfolio/img/og-image.png' %}" />

    <!-- JSON-LD Person schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Malla Bala Raju",
      "email": "mailto:mallabalaraju7@gmail.com",
      "jobTitle": "Full-Stack & DevOps Engineer",
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Lovely Professional University"
      },
      "sameAs": [
        "https://github.com/MallaBalaRaju",
        "https://www.linkedin.com/in/malla-balaraju/"
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Compiled Tailwind CSS -->
    <link rel="stylesheet" href="{% static 'portfolio/css/tailwind.css' %}" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    {% block content %}{% endblock %}

    <script src="{% static 'portfolio/js/particles.js' %}" defer></script>
    <script src="{% static 'portfolio/js/main.js' %}" defer></script>
  </body>
</html>
