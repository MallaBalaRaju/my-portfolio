<div
  id="preloader"
  class="fixed inset-0 z-[10000] flex flex-col items-center justify-center bg-bg transition-opacity duration-300"
  aria-hidden="true"
>
  <div class="text-center">
    <p class="text-3xl font-bold tracking-tight mb-2">
      <span class="gradient-text">{{ personal.short_name }}</span><span class="text-primary">.</span>
    </p>
    <p class="text-xs font-mono tracking-widest uppercase mb-6 text-muted-fg">
      Loading Portfolio
    </p>
  </div>

  <div class="w-44 h-[2px] rounded-full overflow-hidden bg-white/10">
    <div
      id="preloader-bar"
      class="h-full rounded-full transition-all duration-75"
      style="width: 0%; background: linear-gradient(90deg, #10B981, #38BDF8);"
    ></div>
  </div>

  <p id="preloader-percent" class="text-xs font-mono mt-3 text-muted-fg">0%</p>
</div>
