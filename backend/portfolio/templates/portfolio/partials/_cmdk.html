<div
  id="cmdk-modal"
  class="hidden fixed inset-0 z-[250] items-start justify-center pt-20 sm:pt-28 px-4"
  role="dialog"
  aria-modal="true"
  aria-label="Quick jump command palette"
>
  <div
    id="cmdk-backdrop"
    class="absolute inset-0 bg-bg/80 backdrop-blur-sm"
    aria-hidden="true"
  ></div>

  <div class="relative w-full max-w-lg rounded-2xl bg-card border border-white/15 shadow-2xl overflow-hidden z-10 glow-border">
    <div class="flex items-center gap-3 px-4 py-3 border-b border-white/10">
      <svg class="w-4 h-4 text-primary flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
      <input
        id="cmdk-input"
        type="text"
        placeholder="Jump to project, resume, section, or action..."
        autocomplete="off"
        class="w-full bg-transparent text-sm text-white placeholder:text-muted-fg focus:outline-none"
      />
      <kbd class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-white/5 text-muted-fg">ESC</kbd>
    </div>

    <div id="cmdk-results" class="max-h-80 overflow-y-auto p-2 space-y-1"></div>
  </div>
</div>

{{ cmdk_data|json_script:"cmdk-data" }}
