<section id="experience" class="py-28 px-4 relative">
  <div class="container max-w-4xl mx-auto">
    <!-- Heading -->
    <div>
      <p class="text-xs font-mono text-primary mb-3 tracking-[0.2em] uppercase">
        Experience
      </p>
      <h2 class="text-3xl md:text-4xl font-bold tracking-[-0.03em] text-white mb-12">
        Journey &amp; <span class="gradient-text">Achievements</span>
      </h2>
    </div>

    <!-- Timeline -->
    <div class="relative">
      <div class="timeline-line absolute left-[19px] top-2 bottom-2 hidden md:block" aria-hidden="true"></div>

      <div class="space-y-6">
        {% for item in experience %}
          <div class="flex gap-5 group">
            <!-- Timeline dot -->
            <div class="hidden md:flex flex-col items-center pt-1.5" aria-hidden="true">
              <div class="timeline-dot"></div>
            </div>

            <!-- Card -->
            <div class="flex-1 glass glass-hover rounded-xl p-5 transition-all duration-300">
              <div class="flex items-start justify-between gap-3 mb-2">
                <div class="flex items-center gap-2">
                  {% if item.icon == "Briefcase" %}
                    <svg class="w-4 h-4 flex-shrink-0" style="color: var(--p1);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <rect width="20" height="14" x="2" y="7" rx="2" ry="2"></rect>
                      <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                  {% elif item.icon == "BookOpen" %}
                    <svg class="w-4 h-4 flex-shrink-0" style="color: var(--p1);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                  {% else %}
                    <svg class="w-4 h-4 flex-shrink-0" style="color: var(--p1);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <circle cx="12" cy="8" r="6"></circle>
                      <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path>
                    </svg>
                  {% endif %}
                  <h3 class="text-sm font-semibold text-white">{{ item.title }}</h3>
                </div>
                <span class="text-[11px] font-mono text-muted-fg/60 whitespace-nowrap">
                  {{ item.date }}
                </span>
              </div>
              <p class="text-xs font-mono mb-2" style="color: var(--p1);">{{ item.org }}</p>
              <p class="text-sm text-muted-fg leading-relaxed">{{ item.desc }}</p>
            </div>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
