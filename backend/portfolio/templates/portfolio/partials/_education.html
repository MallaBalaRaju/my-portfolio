<section id="education" class="py-24 px-4 sm:px-6 relative">
  <div class="max-w-5xl mx-auto">
    <p class="text-xs font-mono text-primary mb-2 tracking-wide">
      Education
    </p>
    <h2 class="text-3xl md:text-4xl font-semibold tracking-tight text-white mb-10">
      Academic <span class="text-primary">Background</span>
    </h2>

    <div class="grid gap-5">
      {% for edu in education %}
        <div class="surface-card surface-card-hover p-6 min-w-0">
          <div class="flex items-start gap-4">
            <div
              class="p-2.5 rounded-lg mt-0.5 flex-shrink-0 text-primary"
              style="background: var(--chip-bg);"
              aria-hidden="true"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
              </svg>
            </div>

            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-2 sm:gap-3 flex-wrap">
                <div class="min-w-0">
                  <h3 class="text-lg font-semibold text-white">{{ edu.degree }}</h3>
                  {% if edu.field %}
                    <p class="text-sm text-muted-fg">{{ edu.field }}</p>
                  {% endif %}
                </div>
                <span class="text-xs font-mono text-muted-fg sm:whitespace-nowrap mt-1 tabular-nums">
                  {{ edu.period }}
                </span>
              </div>

              <p class="text-sm text-muted-fg mt-1">{{ edu.school }}</p>

              <div class="flex items-center gap-1.5 mt-0.5">
                <svg class="w-3.5 h-3.5 text-muted-fg flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span class="text-xs text-muted-fg">{{ edu.location }}</span>
              </div>

              <div class="flex items-center gap-3 mt-3 flex-wrap">
                <span class="skill-chip text-xs tabular-nums">{{ edu.grade }}</span>
                {% if edu.highlight %}
                  <span class="skill-chip text-xs text-white">{{ edu.highlight }}</span>
                {% endif %}
              </div>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
