<section id="education" class="py-28 px-4 relative">
  <div class="container max-w-4xl mx-auto">
    <!-- Heading -->
    <div>
      <p class="text-xs font-mono text-primary mb-3 tracking-[0.2em] uppercase">
        Education
      </p>
      <h2 class="text-3xl md:text-4xl font-bold tracking-[-0.03em] text-white mb-12">
        Academic <span class="gradient-text">Background</span>
      </h2>
    </div>

    <!-- Education cards -->
    <div class="grid gap-5">
      {% for edu in education %}
        <div class="glass glass-hover rounded-xl p-6 transition-all duration-300">
          <div class="flex items-start gap-4">
            <div
              class="p-2.5 rounded-lg mt-0.5 flex-shrink-0"
              style="background: var(--chip-bg); color: var(--p1);"
              aria-hidden="true"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
              </svg>
            </div>

            <div class="flex-1">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <h3 class="text-lg font-semibold text-white">{{ edu.degree }}</h3>
                  {% if edu.field %}
                    <p class="text-sm text-muted-fg">{{ edu.field }}</p>
                  {% endif %}
                </div>
                <span class="text-[11px] font-mono text-muted-fg/60 whitespace-nowrap mt-1">
                  {{ edu.period }}
                </span>
              </div>

              <p class="text-sm text-muted-fg mt-1">{{ edu.school }}</p>

              <div class="flex items-center gap-1 mt-0.5">
                <svg class="w-3 h-3 text-muted-fg/50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span class="text-xs text-muted-fg/50">{{ edu.location }}</span>
              </div>

              <div class="flex items-center gap-3 mt-3 flex-wrap">
                <span class="skill-chip text-xs" style="color: var(--p1);">{{ edu.grade }}</span>
                {% if edu.highlight %}
                  <span class="skill-chip text-xs text-white">{{ edu.highlight }}</span>
                {% endif %}
              </div>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
