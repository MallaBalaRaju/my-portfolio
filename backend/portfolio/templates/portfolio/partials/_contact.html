<section id="contact" class="py-28 px-4 relative">
  <div class="container max-w-4xl mx-auto">
    <!-- Heading -->
    <div class="text-center mb-12">
      <p class="text-xs font-mono text-primary mb-3 tracking-[0.2em] uppercase">
        Contact
      </p>
      <h2 class="text-3xl md:text-4xl font-bold tracking-[-0.03em] text-white mb-4">
        Let&apos;s <span class="gradient-text">Connect</span>
      </h2>
      <p class="text-muted-fg max-w-md mx-auto">
        I&apos;m always open to discussing new opportunities, collaborations,
        or just chatting about tech.
      </p>
    </div>

    <!-- Contact cards grid -->
    <div class="grid sm:grid-cols-2 gap-4 max-w-2xl mx-auto">
      <!-- Email -->
      <a
        href="{{ socials.email }}"
        class="glass glass-hover rounded-xl p-5 flex items-center gap-4 transition-all duration-300 group focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
      >
        <div class="p-2.5 rounded-lg flex-shrink-0" style="background: var(--chip-bg); color: var(--p1);" aria-hidden="true">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[11px] font-mono text-muted-fg/60 uppercase tracking-widest">Email</p>
          <p class="text-sm text-white truncate">{{ personal.email }}</p>
        </div>
        <svg class="w-4 h-4 text-muted-fg/30 group-hover:text-primary transition-colors flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 7h10v10"></path>
          <path d="M7 17 17 7"></path>
        </svg>
      </a>

      <!-- Phone -->
      <a
        href="{{ socials.phone }}"
        class="glass glass-hover rounded-xl p-5 flex items-center gap-4 transition-all duration-300 group focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
      >
        <div class="p-2.5 rounded-lg flex-shrink-0" style="background: var(--chip-bg); color: var(--p1);" aria-hidden="true">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[11px] font-mono text-muted-fg/60 uppercase tracking-widest">Phone</p>
          <p class="text-sm text-white truncate">{{ personal.phone }}</p>
        </div>
        <svg class="w-4 h-4 text-muted-fg/30 group-hover:text-primary transition-colors flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 7h10v10"></path>
          <path d="M7 17 17 7"></path>
        </svg>
      </a>

      <!-- LinkedIn -->
      <a
        href="{{ socials.linkedin }}"
        target="_blank"
        rel="noopener noreferrer"
        class="glass glass-hover rounded-xl p-5 flex items-center gap-4 transition-all duration-300 group focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
      >
        <div class="p-2.5 rounded-lg flex-shrink-0" style="background: var(--chip-bg); color: var(--p1);" aria-hidden="true">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
            <rect width="4" height="12" x="2" y="9"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[11px] font-mono text-muted-fg/60 uppercase tracking-widest">LinkedIn</p>
          <p class="text-sm text-white truncate">linkedin.com/in/malla-balaraju</p>
        </div>
        <svg class="w-4 h-4 text-muted-fg/30 group-hover:text-primary transition-colors flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 7h10v10"></path>
          <path d="M7 17 17 7"></path>
        </svg>
      </a>

      <!-- GitHub -->
      <a
        href="{{ socials.github }}"
        target="_blank"
        rel="noopener noreferrer"
        class="glass glass-hover rounded-xl p-5 flex items-center gap-4 transition-all duration-300 group focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
      >
        <div class="p-2.5 rounded-lg flex-shrink-0" style="background: var(--chip-bg); color: var(--p1);" aria-hidden="true">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[11px] font-mono text-muted-fg/60 uppercase tracking-widest">GitHub</p>
          <p class="text-sm text-white truncate">github.com/MallaBalaRaju</p>
        </div>
        <svg class="w-4 h-4 text-muted-fg/30 group-hover:text-primary transition-colors flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 7h10v10"></path>
          <path d="M7 17 17 7"></path>
        </svg>
      </a>
    </div>
  </div>
</section>
