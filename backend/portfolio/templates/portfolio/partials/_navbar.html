{% load static %}
<header>
  <nav
    id="main-navbar"
    aria-label="Main navigation"
    class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-transparent"
  >
    <div class="max-w-6xl mx-auto flex items-center justify-between h-16 px-4">
      <!-- Logo -->
      <a
        href="#hero"
        class="font-bold text-lg tracking-tight hover:opacity-80 transition-opacity focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-bg rounded"
        aria-label="{{ personal.name }} — back to top"
      >
        <span class="gradient-text">{{ personal.short_name }}</span><span class="text-[hsl(var(--primary-h),var(--primary-s),var(--primary-l))]">.</span>
      </a>

      <!-- Nav links — desktop -->
      <nav class="hidden md:flex items-center gap-1" aria-label="Desktop navigation">
        {% for link in nav_links %}
          <a
            href="{{ link.href }}"
            data-nav-link
            class="relative text-sm px-3 py-1.5 rounded-lg transition-colors duration-200 text-[var(--muted-text)] hover:text-[var(--text-main)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-bg"
          >
            <span
              data-nav-pill
              class="hidden absolute inset-0 rounded-lg"
              style="background: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.1); border: 1px solid hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.2);"
              aria-hidden="true"
            ></span>
            <span class="relative z-10">{{ link.label }}</span>
          </a>
        {% endfor %}
      </nav>

      <!-- Right-side CTAs -->
      <div class="flex items-center gap-2">
        <!-- Resume download -->
        <a
          href="{% static socials.resume_static_path %}"
          download
          aria-label="Download resume PDF"
          class="inline-flex items-center gap-1.5 text-sm px-3 sm:px-4 py-2 rounded-lg border border-[hsla(var(--primary-h),var(--primary-s),var(--primary-l),0.3)] text-[var(--text-main)] hover:bg-[hsla(var(--primary-h),var(--primary-s),var(--primary-l),0.1)] hover:border-[hsla(var(--primary-h),var(--primary-s),var(--primary-l),0.5)] transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-bg"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" x2="12" y1="15" y2="3"></line>
          </svg>
          <span class="hidden sm:inline">Resume</span>
        </a>

        <!-- Let's Talk -->
        <a
          href="#contact"
          class="hidden sm:inline-flex items-center text-sm px-4 py-2 rounded-lg bg-[hsl(var(--primary-h),var(--primary-s),var(--primary-l))] text-white hover:brightness-110 transition-all duration-200 active:scale-95 glow-border focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-bg"
        >
          Let&apos;s Talk
        </a>

        <!-- Mobile menu toggle -->
        <button
          id="mobile-menu-btn"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="mobile-nav"
          class="md:hidden p-2 rounded-lg text-muted-fg hover:text-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-bg"
        >
          <svg id="mobile-menu-icon-open" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" x2="20" y1="12" y2="12"></line>
            <line x1="4" x2="20" y1="6" y2="6"></line>
            <line x1="4" x2="20" y1="18" y2="18"></line>
          </svg>
          <svg id="mobile-menu-icon-close" class="hidden w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile nav drawer -->
    <div
      id="mobile-nav"
      class="hidden md:hidden glass-nav border-t border-[var(--glass-border)] px-4 py-4"
      role="navigation"
      aria-label="Mobile navigation"
    >
      <div class="flex flex-col gap-1">
        {% for link in nav_links %}
          <a
            href="{{ link.href }}"
            data-mobile-nav-link
            class="text-sm px-3 py-2.5 rounded-lg transition-colors duration-200 text-[var(--muted-text)] hover:text-[var(--text-main)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
          >
            {{ link.label }}
          </a>
        {% endfor %}
        <a
          href="{% static socials.resume_static_path %}"
          download
          class="mt-2 inline-flex items-center gap-2 text-sm px-3 py-2.5 rounded-lg border border-[hsla(var(--primary-h),var(--primary-s),var(--primary-l),0.3)] text-[var(--text-main)] hover:bg-[hsla(var(--primary-h),var(--primary-s),var(--primary-l),0.1)] transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" x2="12" y1="15" y2="3"></line>
          </svg>
          Download Resume
        </a>
      </div>
    </div>
  </nav>
</header>
