<section id="about" class="py-24 px-4 sm:px-6 relative">
  <div class="max-w-5xl mx-auto">
    <p class="text-xs font-mono text-primary mb-2 tracking-wide">
      About
    </p>
    <h2 class="text-3xl md:text-4xl font-semibold tracking-tight text-white mb-8">
      Full-Stack engineering with a <span class="text-primary">DevOps foundation</span>
    </h2>

    <div class="space-y-4 max-w-3xl">
      {% for p in about.paragraphs %}
        <p class="text-muted-fg leading-relaxed text-base">
          {{ p }}
        </p>
      {% endfor %}
    </div>

    <div class="grid sm:grid-cols-3 gap-4 mt-10">
      {% for item in about.highlights %}
        <div class="surface-card surface-card-hover p-5 min-w-0">
          <div
            class="p-2.5 rounded-lg w-fit mb-4 text-primary"
            style="background: var(--chip-bg);"
            aria-hidden="true"
          >
            {% if item.icon == "Cloud" %}
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
              </svg>
            {% elif item.icon == "Database" %}
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                <path d="M3 5V19A9 3 0 0 0 21 19V5"></path>
                <path d="M3 12A9 3 0 0 0 21 12"></path>
              </svg>
            {% else %}
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="m18 16 4-4-4-4"></path>
                <path d="m6 8-4 4 4 4"></path>
                <path d="m14.5 4-5 16"></path>
              </svg>
            {% endif %}
          </div>
          <h3 class="text-sm font-semibold text-white mb-1">{{ item.label }}</h3>
          <p class="text-xs text-muted-fg leading-relaxed">{{ item.desc }}</p>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
