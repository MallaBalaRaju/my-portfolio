<footer class="relative z-10 pt-8 pb-10 px-4 overflow-hidden">
  <!-- Glowing orb at the top center -->
  <div class="flex justify-center mb-6" aria-hidden="true">
    <div class="footer-orb"></div>
  </div>

  <!-- Divider line -->
  <div class="section-line mb-6" aria-hidden="true"></div>

  <!-- Built by text -->
  <p class="text-center font-mono text-xs tracking-widest" style="color: var(--muted-text);">
    Built by
    <a
      href="{{ socials.github }}"
      target="_blank"
      rel="noopener noreferrer"
      class="font-semibold transition-all duration-200 hover:underline"
      style="color: hsl(var(--primary-h) var(--primary-s) var(--primary-l));"
    >
      {{ personal.name }}
    </a>
    · Django · {{ current_year }}
  </p>
</footer>
